spring:
  # database configurations
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:documental}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  #open ai configuratin
#  ai:
#    openai:
#      api-key: ${OPENAI_API_KEY:demo-key}
#      chat:
#       model: ${OPENAI_MODEL:gpt-4o-mini}
#       temperature: 0.2
#
#      embedding:
#        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

  ai:
    # Google Gemini
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.6-flash}
          temperature: 0.2
          max-output-tokens: 2048

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 1536

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

app:
  rag:
    # Smaller chunks + overlap = better clause/fact extraction across boundaries
    chunk-size: 350
    chunk-overlap: 80
    min-chunk-size-chars: 120
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    # Concise chat uses fewer; detailed mode can request more via API
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "https://documental-jet.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

  jwt:
    secret: ${JWT_SECRET:documental-dev-secret-change-me-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}



